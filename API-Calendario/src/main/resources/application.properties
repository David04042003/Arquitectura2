spring.application.name=apicalendario

# La API Festivos usa el puerto 8080, por eso esta API usa el 8081
server.port=${PUERTO:8081}

# --- PostgreSQL ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/calendario}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_CLAVE:postgres}

# Las tablas se crean con schema.sql y el catálogo "tipo" se carga con data.sql.
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- API Festivos (punto 1) ---
festivos.api.url=${FESTIVOS_API_URL:http://localhost:8080}
festivos.api.tiempo-espera=5s

# --- Seguridad (token JWT) ---
# Clave HMAC en Base64 (mínimo 256 bits). En producción se debe definir con la variable JWT_SECRETO.
seguridad.jwt.secreto=${JWT_SECRETO:nQ7w588Alrd8kAThalC6P0c8iLXKxFSowKVbB+r7Ybc=}
seguridad.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:30}

# Usuario que se crea al iniciar si no existe (la clave se guarda cifrada con BCrypt)
seguridad.usuario-inicial.usuario=${USUARIO_INICIAL:admin}
seguridad.usuario-inicial.nombre=${USUARIO_INICIAL_NOMBRE:Administrador}
seguridad.usuario-inicial.clave=${USUARIO_INICIAL_CLAVE:admin123}
seguridad.usuario-inicial.roles=ADMIN

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
